# deploy.yml — CI/CD automático
# Al hacer push a main: lint del backend, y Vercel despliega el frontend automáticamente
name: Deploy Tecnocel

on:
  push:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd backend && npm ci
      - run: cd backend && npm run lint --if-present

  # El deploy del frontend lo hace Vercel automáticamente
  # al detectar el push en GitHub (conectado en vercel.com)
