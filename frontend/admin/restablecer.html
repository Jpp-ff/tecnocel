<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tecnocel — Restablecer contraseña</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --black:#080808;--dark:#111111;--border:#2a2a2a;--gray:#4a4a4a;--gray-mid:#888888;
      --white:#f5f5f5;--pink:#e91e8c;--pink-dim:#9e1460;--green:#22c55e;--red:#ef4444;
      --font-disp:'Bebas Neue',sans-serif;--font-body:'Outfit',sans-serif;
    }
    body.light{--black:#f2f0eb;--dark:#ffffff;--border:#e0ddd4;--gray:#6b6a63;--white:#171614;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--black);color:var(--white);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;transition:background .2s,color .2s;}
    .card{width:100%;max-width:400px;background:var(--dark);border:1px solid var(--border);border-radius:14px;padding:2.4rem 2.2rem;}
    .logo-wrap{text-align:center;margin-bottom:1.5rem;}
    .logo-wrap img{height:60px;object-fit:contain;mix-blend-mode:screen;filter:brightness(1.15) contrast(1.05);}
    .title{font-family:var(--font-disp);font-size:1.6rem;letter-spacing:2px;text-align:center;margin-bottom:.3rem;}
    .subtitle{font-size:.82rem;color:var(--gray-mid);text-align:center;margin-bottom:1.8rem;}
    .form-group{margin-bottom:1.1rem;}
    .form-group label{display:block;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-mid);margin-bottom:.5rem;}
    .form-group input{width:100%;background:var(--black);border:1px solid var(--border);color:var(--white);padding:.8rem 1rem;border-radius:6px;font-size:.9rem;outline:none;}
    .form-group input:focus{border-color:var(--pink);}
    .btn-primary{width:100%;background:var(--pink);color:#fff;border:none;padding:.85rem;border-radius:6px;font-size:.92rem;font-weight:600;cursor:pointer;margin-top:.5rem;}
    .btn-primary:hover{background:var(--pink-dim);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
    .msg{display:none;font-size:.82rem;padding:.7rem .9rem;border-radius:6px;margin-bottom:1.1rem;}
    .msg.show{display:block;}
    .msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);}
    .msg.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green);}
    .back-link{display:block;text-align:center;margin-top:1.4rem;font-size:.78rem;color:var(--gray);text-decoration:none;}
    .back-link:hover{color:var(--pink);}
  </style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><img src="../assets/img/logo tecnocel - Editado.png" alt="Tecnocel"/></div>
  <div class="title">NUEVA CONTRASEÑA</div>
  <div class="subtitle">Define tu nueva contraseña de acceso</div>

  <div class="msg" id="msgBox"></div>

  <form onsubmit="return manejarReset(event)" id="resetForm">
    <div class="form-group"><label>Nueva contraseña</label><input type="password" id="password" minlength="8" placeholder="Mínimo 8 caracteres" required/></div>
    <div class="form-group"><label>Confirmar contraseña</label><input type="password" id="passwordConfirm" minlength="8" placeholder="Repite la contraseña" required/></div>
    <button type="submit" class="btn-primary" id="btnReset">Restablecer contraseña</button>
  </form>

  <a class="back-link" href="login.html">← Volver al inicio de sesión</a>
</div>

<script>
  const API_URL = 'http://localhost:3000';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if(!token){
    document.getElementById('resetForm').style.display = 'none';
    mostrarMensaje('Este enlace no es válido. Solicita uno nuevo desde la pantalla de inicio de sesión.', 'error');
  }

  function mostrarMensaje(texto, tipo){
    const box = document.getElementById('msgBox');
    box.textContent = texto;
    box.className = 'msg show ' + tipo;
  }

  async function manejarReset(e){
    e.preventDefault();
    const btn = document.getElementById('btnReset');
    const password = document.getElementById('password').value;
    const confirmar = document.getElementById('passwordConfirm').value;
    if(password !== confirmar){ mostrarMensaje('Las contraseñas no coinciden.', 'error'); return false; }
    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      const res = await fetch(API_URL + '/api/auth/restablecer', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();
      if(!data.success) throw new Error(data.message);
      mostrarMensaje('Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(()=>window.location.href='login.html', 1800);
    } catch(err){
      mostrarMensaje(err.message || 'No se pudo restablecer la contraseña.', 'error');
      btn.disabled = false; btn.textContent = 'Restablecer contraseña';
    }
    return false;
  }
</script>
</body>
</html>
